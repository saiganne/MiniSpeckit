name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit test suite
        run: npm test

      - name: Smoke test CLI commands
        run: |
          node bin/minispec.js --help
          node bin/minispec.js --version
          node bin/minispec.js init
          node bin/minispec.js new "Test Feature" --template default
          node bin/minispec.js status
          node bin/minispec.js check
